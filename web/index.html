<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Recommender</title>
<style>
  /* 配色直接抄 GitHub 深色主题,不自创 —— 少一件事要想 */
  :root {
    --bg:      #0d1117;
    --card:    #161b22;
    --border:  #30363d;
    --text:    #c9d1d9;
    --muted:   #8b949e;
    --accent:  #58a6ff;
    --ok:      #3fb950;
    --bad:     #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 20px;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 6px; }
  .tab {
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .tab:hover { background: var(--card); color: var(--text); }
  .tab.active { background: var(--card); border-color: var(--border); color: var(--text); }

  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  .status { color: var(--muted); padding: 20px 0; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 12px;
  }
  .card-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { color: var(--accent); text-decoration: none; font-size: 16px; font-weight: 600; }
  .name:hover { text-decoration: underline; }
  .reason { color: var(--muted); font-size: 12px; }
  .desc { color: var(--muted); margin: 6px 0 10px; }
  /* 介绍:来自 README 的那段,比 description 更具体,所以给正文色而不是灰字 */
  .intro {
    color: var(--text); background: #0d1117; border-left: 3px solid var(--border);
    border-radius: 4px; padding: 8px 12px; margin: 0 0 10px; font-size: 13px;
  }
  .intro-label { color: var(--muted); font-weight: 600; }
  .meta { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .topics { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .topic {
    background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb55;
    border-radius: 20px; padding: 1px 10px; font-size: 12px;
  }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    background: #21262d; border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.ok:hover  { border-color: var(--ok);  color: var(--ok); }
  .btn.bad:hover { border-color: var(--bad); color: var(--bad); }
  /* 已选中的那个按钮 —— 按钮不禁用,随时可以改点另一个 */
  .btn.ok.chosen  { border-color: var(--ok);  color: var(--ok);  background: #3fb95018; }
  .btn.bad.chosen { border-color: var(--bad); color: var(--bad); background: #f8514918; }
  .vote-note { color: var(--muted); font-size: 12px; align-self: center; }
  .delta { color: var(--ok); font-weight: 600; }

  /* ---------- 详情页 ---------- */
  .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0 6px; }
  .detail-title { font-size: 20px; margin: 0; }
  .detail-desc { color: var(--muted); margin: 0 0 12px; }
  .detail-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .btn.back { margin-bottom: 4px; }
  .btn.gh { text-decoration: none; display: inline-block; }
  .detail-intro {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; margin-top: 14px;
  }
  .section-title {
    font-size: 12px; color: var(--muted); font-weight: 600;
    letter-spacing: .06em; margin-bottom: 8px;
  }
  /* README 正文:保留换行(pre-wrap),超长可滚动 */
  pre.readme {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 12.5px/1.7 ui-monospace, Consolas, "Noto Sans Mono CJK SC", monospace;
    color: var(--text); max-height: 460px; overflow-y: auto;
  }
  .muted { color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 20px; height: 110px; padding-top: 8px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart-bar { width: 26px; background: var(--accent); border-radius: 3px 3px 0 0; }
  .chart-label { font-size: 11px; color: var(--muted); }
  .similar-row { padding: 4px 0; }

  /* ---------- 作者头像 ---------- */
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); object-fit: cover; flex: 0 0 auto;
  }
  .detail-head .avatar { width: 40px; height: 40px; }
  .owner-link { color: var(--muted); text-decoration: none; }
  .owner-link:hover { color: var(--accent); text-decoration: underline; }

  /* ---------- 工具栏:刷新 / 排序 / 当前筛选 ---------- */
  /* 搜索框吃掉剩余空间,把后面的语言/刷新按钮推到最右 */
  .search {
    margin-left: auto; width: 300px; font-size: 13px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; color: var(--text);
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }
  .scope {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 6px; font-size: 12px; cursor: pointer;
  }
  .btn.batch { margin-right: 2px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar label { font-size: 12px; color: var(--muted); }
  .toolbar select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px; cursor: pointer;
  }
  /* 当前生效的筛选条件,点 ✕ 取消 */
  .chip {
    background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb55;
    border-radius: 20px; padding: 2px 10px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { background: #1f6feb33; }
  /* 文本块最多 4 行,超了打点省略 —— 有的 repo 描述/介绍长得离谱,
     一张卡能撑满整屏,列表就没法扫了。数据层也截了,这里是第二道保险 */
  .desc, .intro {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 作者(头像 + 名字) */
  .owner { display: inline-flex; align-items: center; gap: 5px; }
  .owner .avatar { width: 14px; height: 14px; }
  .detail-meta .owner .avatar { width: 18px; height: 18px; }

  /* 卡片上的标签可点:点了就看同标签的 repo */
  .topic.clickable { cursor: pointer; }
  .topic.clickable:hover { background: #1f6feb55; }
  /* 已选中的标签:高亮,再点一下取消 */
  .topic.on { background: #1f6feb66; border-color: var(--accent); color: #fff; }
  .tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagcloud .topic { cursor: pointer; font-size: 13px; padding: 3px 12px; }
  .tagcloud .topic:hover { background: #1f6feb55; }
</style>
</head>
<body>
<header>
  <h1>Repo Recommender</h1>
  <nav>
    <button class="tab active" data-tab="trending" data-i18n="tab_trending">Trending</button>
    <button class="tab" data-tab="recommend" data-i18n="tab_recommend">推荐</button>
    <button class="tab" data-tab="tags" data-i18n="tab_tags">标签</button>
    <button class="tab" data-tab="starred" data-i18n="tab_starred">我的</button>
  </nav>
  <input id="search" class="search" type="search"
         placeholder="搜索 repo:名字 / 描述 / 标签 / README">
  <select id="scope" class="scope" title="搜索范围 / Search scope">
    <option value="local">本地库</option>
    <option value="github">全 GitHub</option>
  </select>
  <button id="lang" class="btn lang" title="切换语言 / Switch language">EN</button>
  <button id="refresh" class="btn refresh" data-i18n="refresh">↻ 刷新</button>
</header>
<main>
  <div id="toolbar" class="toolbar"></div>
  <div id="status" class="status">加载中…</div>
  <div id="detail" style="display:none"></div>
  <div id="list"></div>
</main>
<script src="app.js"></script>
</body>
</html>
