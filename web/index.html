<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory</title>

<!-- 兔子洞标题的字体,**必须 preload**。
     不 preload 的话,字体要等 app.js 跑完、标题文字插进 DOM 之后才开始下载 ——
     而 app.js 有 90 多 KB,是这个字体(不到 2 KB)的五十倍。
     等它下载+解析完再下字体,标题就会先显示成系统字体、过一拍才变过来。
     preload 让浏览器**解析 HTML 时**就开始下它,基本能赶在文字出现之前拿到。

     ⚠️ 必须带 crossorigin —— **即使同源**。浏览器取字体走的是 CORS 模式,
     漏了这个属性会下载两次(一次 preload、一次真正用到时),反而更慢。 -->
<link rel="preload" as="font" type="font/woff2"
      href="/acg-title.woff2?v=__FONT_V__" crossorigin>
<style>
  /* 视觉参照 Threads / X:纯黑底、窄栏内容、细线分隔、导航竖排在右侧。
     导航可以折成只剩图标(窄屏自动折),内容区跟着让位。 */
  /* 兔子洞页首那句日文的字体:Donguriko(どんぐりこ,toktaro fonts 出品的手写体)。
     **免费版只收录平假名和标点,没有汉字** —— 所以标题里的「穴」写成了假名「あな」。
     许可证:免费版允许个人使用;商用需要关注作者的账号。

     ⚠️ **这份是子集化的,不是完整字体。**
     完整字重 35 KB,我们只要标题那 11 个字符 —— pyftsubset 之后 **1.9 KB**。
     (日文字体动辄几 MB,不子集的话为了一句标题要拖来几兆的东西,
      正好是之前花力气干掉的那类大文件。)

     ⚠️ **改标题文字 = 必须重新生成这个文件。** 字体里只有现在这几个字,
     新加的字会掉回系统字体 —— 表现出来是"只有一部分字用了新字体",很难看出原因。
     `tests/check_frontend.py` 里有一条测试专门盯这个:
     它会从 app.js 里读出 ACG_TITLE,再核对字体里有没有这些字。
     生成方式(注意别用 shell 变量,曾经因此产出过空字体):
       .venv/bin/python -m fontTools.subset 全量字体.ttf \
         --text="うさぎのあなへようこそ！" --output-file=web/acg-title.woff2 \
         --flavor=woff2 --no-hinting --layout-features= */
  @font-face {
    font-family: "ACG Title";
    /* ?v=__FONT_V__ 是**内容哈希**,由 api.py 在返回 HTML 时替换。
       加它是因为字体也和 app.js 一样会被 Cloudflare 强制缓存 4 小时 ——
       没有版本号的话,换了字体文件浏览器里那份旧的还是照用,看起来"一点没变"。
       (真踩过,而且当时换上去的那份还是个坏的空子集。) */
    src: url("/acg-title.woff2?v=__FONT_V__") format("woff2");
    font-display: swap;   /* 字体没到之前先用系统字体显示,别让标题空着 */
  }

  /* 夜晚模式(默认)。白天模式在 body.light 里整组覆盖 —— 只换变量,
     不去每个规则里写两遍颜色。 */
  :root {
    --bg:      #000000;
    --text:    #f5f5f5;
    --muted:   #8e8e8e;
    --line:    rgba(255, 255, 255, 0.15);
    --hover:   rgba(255, 255, 255, 0.06);
    --fill:    rgba(255, 255, 255, 0.08);
    --headbg:  rgba(0, 0, 0, 0.75);       /* 顶栏毛玻璃底色 */
    --shadow:  rgba(0, 0, 0, 0.65);
    --like:    #ff3040;
    --accent:  #ffffff;                    /* 主按钮 / 选中态 */
    --on-accent: #000000;                  /* 压在 accent 上的文字色 */
    --warn:    #ffb224;                    /* 提醒(不是报错):token 失效那种 */
    --warn-bg: rgba(255, 178, 36, 0.12);

    /* 花体(手写体)。**刻意不用 Google Fonts** —— 那要多一次外部请求,
       而且在国内经常连不上;这个站刚花力气把加载速度修好(头像那次),
       不能在这儿又加回去。用系统自带的:Windows 有 Segoe Script / Brush Script MT,
       Mac 有 Snell Roundhand。最后那个 cursive 是兜底,保证任何设备上都不会退成宋体。
       (中文/日文假名这些字体里没有字形,会按字形逐个回退到系统默认 —— 这是浏览器行为,
        所以"rabbit hole によっこそ"里拉丁部分是花体、假名是常规体,是正常的。) */
    --font-fancy: "Segoe Script", "Brush Script MT", "Snell Roundhand",
                  "Savoye LET", "Lucida Handwriting", cursive;
    --rail-w:  56px;      /* 收起时只露图标;鼠标移上去自动展开 */
    --radius:  999px;
    color-scheme: dark;   /* 让浏览器把原生控件(下拉列表、滚动条)也渲染成深色 */
  }
  body.light {
    --bg:      #ffffff;
    --text:    #0f1419;
    --muted:   #536471;
    --line:    rgba(0, 0, 0, 0.12);
    --hover:   rgba(0, 0, 0, 0.04);
    --fill:    rgba(0, 0, 0, 0.06);
    --headbg:  rgba(255, 255, 255, 0.8);
    --shadow:  rgba(0, 0, 0, 0.18);
    --like:    #f91880;
    --accent:  #0f1419;                    /* 浅底下,主色反过来用深色 */
    --on-accent: #ffffff;                  /* 所以压在它上面的字要反过来变白 */
    /* 白底上要用更深的琥珀色才看得清 —— 同一个 #ffb224 在白色上几乎读不出来。
       这就是"压在某个背景色上的颜色不能写死"那条教训的又一个例子。 */
    --warn:    #9a5b00;
    --warn-bg: rgba(255, 178, 36, 0.16);
    color-scheme: light;
  }

  /* ---- 二次元分站的皮肤 ---- */
  /* 只覆盖变量,不重写任何规则 —— 整个站的颜色都走这几个变量,
     所以"换肤"就是换一组值。这是当初把颜色全抽成变量的回报:
     加一个分站不需要动任何一条已有的样式。 */
  /* 图片版的导航图标(兔子洞)。尺寸跟线条图标对齐(22px)。 */
  .rail-img { width: 22px; height: 22px; display: block; border-radius: 50%; object-fit: cover; }
  .rail-brand .brand-img { width: 28px; height: 28px; display: block; object-fit: contain; }
  /* icons8 那套图标是**黑线 + 透明底**的 PNG。站点默认深色主题,
     黑图标贴在近黑背景上等于看不见 —— 所以深色下反转成白、浅色下保持黑。
     ⚠️ 只反转主站这一张(.brand-obs)。兔子洞的站标是彩色插画,
     一起反转的话颜色就全毁了。 */
  .brand-obs { filter: invert(1); }
  body.light .brand-obs { filter: none; }

  body.acg {
    /* 背景图:先铺一层**半透明底色把图压暗**,文字才压得住。
       直接把图铺满的话,正文和画面会糊在一起,根本读不了 ——
       背景是气氛,不是内容。 */
    /* 两层:上面一层半透明底色(压暗,保证正文读得清),下面才是图。
       两层要**分别**设 size/position —— 所以都写成逗号分隔的两个值。 */
    background-image:
      linear-gradient(rgba(21, 10, 28, 0.87), rgba(21, 10, 28, 0.87)),
      url("/charlotte.jpg");
    /* ⚠️ 为什么要放大到 140%:
       这是张 16:9 的横构图,人物在画面**中间偏右(约 45%~70%)**,
       而内容栏也是居中的 —— 两者天然重叠,直接铺(cover)人物一定压在正文后面。
       放大之后整张图比视口宽,再把它的**左边缘锚死在视口左边**,
       人物就被推到右侧的空白区去了。
       · 想让人物**再往右**:把这个数调大(140%、150%)
       · 想让人物**往回左**:调小
       · 第二个值 left 是锚点,一般不用动 */
    background-size: cover, 130% auto;
    background-position: center, left center;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;   /* 滚动时图不动,内容在它上面滑过 */

    --bg:      #150a1c;                    /* 深紫黑 */
    --text:    #f7eef5;
    --muted:   #a98fa8;
    --line:    rgba(255, 140, 190, 0.20);
    --hover:   rgba(255, 140, 190, 0.09);
    --fill:    rgba(255, 140, 190, 0.14);
    --headbg:  rgba(21, 10, 28, 0.78);
    --like:    #ff4d94;
    --accent:  #ff7bac;                    /* 樱花粉 */
    --on-accent: #2a0a18;                  /* 压在粉上的字要用深色才看得清 */
    color-scheme: dark;
  }
  /* ⚠️ 两个类一起写(acg + light),权重才压得过上面单独的 body.acg
     和 body.light。少写一个会有半个站是错的配色。 */
  body.acg.light {
    /* 浅色下要压得更狠一点 —— 深色图配浅色文字,不压暗的话对比度完全不够 */
    background-image:
      linear-gradient(rgba(255, 245, 249, 0.90), rgba(255, 245, 249, 0.90)),
      url("/charlotte.jpg");

    --bg:      #fff5f9;
    --text:    #2b1220;
    --muted:   #8a6b78;
    --line:    rgba(210, 70, 130, 0.20);
    --hover:   rgba(210, 70, 130, 0.07);
    --fill:    rgba(210, 70, 130, 0.11);
    --headbg:  rgba(255, 245, 249, 0.82);
    --like:    #e0407f;
    --accent:  #d6447f;
    --on-accent: #ffffff;
    color-scheme: light;
  }
  .acg-intro { font-size: 12.5px; line-height: 1.6; padding: 6px 0 14px; }

  * { box-sizing: border-box; }
  /* ⚠️ 只给 **body** 设背景,html 留透明。原来是 `html, body { background: var(--bg) }`,
     那是个隐蔽的 bug:
       --bg 是在 **body** 上被覆盖的(body.light / body.acg 都写在 body 上),
       而 CSS 自定义属性只**向下**继承 —— html 拿到的永远是 :root 里那个**深色**值。
       而 html 一旦有了背景,body 的背景就**不再传播到画布** ——
       于是浅色模式下,正文盖不满的地方(内容短的页面、手机回弹)会露出一条**黑边**。
     让 html 透明,body 的背景就会传播到整个画布,颜色也跟着主题走。 */
  html { background: transparent; }
  body { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh;
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- 左侧竖导航 ---------- */
  /* 默认只露图标,鼠标移上去自动展开。
     展开是"浮层"(fixed + 高层级),**不挤内容** ——
     否则鼠标一划过,正文就跟着左右跳一下,很难受。 */
  .rail {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 30;
    width: var(--rail-w); overflow: hidden;
    background: var(--bg); border-right: 1px solid var(--line);
    padding: 18px 10px; display: flex; flex-direction: column; gap: 4px;
    transition: width .16s ease, box-shadow .16s ease;
  }
  /* 悬停展开的宽度也别太大 —— 太宽的话鼠标要拖很远才能离开、才会自动收回 */
  .rail:hover { width: 176px; box-shadow: 10px 0 30px var(--shadow); }
  /* 图标用固定的左内边距定位,不是居中 ——
     居中(justify-content: center / margin:auto)在展开时会把图标推到栏中间,
     正好撞上固定在左边的标签。固定左侧位置,图标展开前后都不动。 */
  .rail-btn {
    position: relative;
    display: flex; align-items: center; justify-content: flex-start;
    background: transparent; border: none; border-radius: var(--radius);
    color: var(--text); padding: 11px 0 11px 7px; cursor: pointer;
    font-size: 15px; text-align: left; width: 100%;
    transition: background .12s;
  }
  .rail-btn:hover { background: var(--hover); }
  .rail-btn.active { font-weight: 700; }
  .rail-btn .ico { flex: 0 0 22px; width: 22px; height: 22px; }
  .rail-btn .ico svg { width: 22px; height: 22px; display: block; }
  /* 标签用绝对定位,不占布局宽度。
     之前用 opacity: 0 隐藏 —— 它**仍然占宽度**,于是居中算的是"图标+隐形标签",
     图标被挤出左边界裁掉了。折叠时看着就是歪的 / 缺一块。 */
  .rail-label {
    position: absolute; left: 41px; top: 50%; transform: translateY(-50%);
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .12s;
  }
  .rail:hover .rail-label { opacity: 1; }
  .rail-spacer { flex: 1 1 auto; }

  /* 窗口铺满屏幕(浏览器最大化)时,导航直接摊开、不用悬停 —— 空间有的是。
     窗口不满屏时才收成图标、靠悬停展开。由 JS 按窗口宽度判断后加这个类。 */
  body.rail-open .rail { width: 176px; }
  body.rail-open .rail-label { opacity: 1; }

  /* 站名 + 标记,固定在导航最上方 */
  .rail-brand {
    position: relative; display: flex; align-items: center;
    background: transparent; border: none; color: var(--text);
    padding: 4px 0 20px 4px; cursor: pointer; width: 100%; text-align: left;
  }
  .rail-brand .ico { flex: 0 0 28px; width: 28px; height: 28px; }
  .rail-brand .ico svg { width: 28px; height: 28px; display: block; }
  /* 主站站名:**原来的字体**(无衬线)。花体试过,退回来了 ——
     和页面标题一个道理:花体适合当装饰,标在导航上既不好认也显得吵。 */
  .rail-brand .rail-label { left: 44px; font-size: 16px; font-weight: 700; }

  /* 进了兔子洞:站标(角色图)放大到 72px。
     ⚠️ 竖栏必须跟着加宽,而且**收起状态也要宽** ——
     竖栏是 overflow:hidden 的,56px 的收起宽度会把 72px 的图标直接裁掉一半。
     所以这里连 --rail-w 本身一起改(它同时决定内容区往右让多少)。 */
  body.acg { --rail-w: 96px; }
  body.acg .rail-brand .ico { flex: 0 0 72px; width: 72px; height: 72px; }
  body.acg .rail-brand .brand-img { width: 72px; height: 72px; }
  /* 洞里竖栏宽得多(268px),站标也大 —— 站名跟着放大一号才配得上。
     ⚠️ 花体**只在这里**(兔子洞)。主站那边已经退回原来的无衬线体了 ——
     导航上的字要好认,花体适合当日首标题那样的装饰。 */
  body.acg .rail-brand .rail-label {
    left: 86px; font-size: 19px; font-family: var(--font-fancy);
  }

  /* 花体**只用在兔子洞的页首标题**(那句 "rabbit holeによっこそ")。
     主站的页面标题保持原样:那些标题是"为你推荐""已收藏""标签"这类中文,
     花体套上去既不好看、也读不快 —— 花体适合当装饰,不适合当导航。
     顺带把字号提一号、取消字距微调(那个 -0.015em 是给无衬线体调的,
     换手写体之后反而会挤在一起)。 */
  body.acg .headrow h1 {
    /* ⚠️ 这里**刻意只留一个兜底**(继承页面的默认字体)。
       原来写的是 `"ACG Title", var(--font-fancy)` —— 那一串花体全是拉丁字体,
       对假名一个字形都没有,浏览器会**跳过它们去找通用族 `cursive`**,
       而 Windows 把日文的 cursive 解析成一个明朝体。
       结果标题刷新时会变两次:无衬线 → 明朝体 → Donguriko。
       现在少一层:无衬线 → Donguriko。再加上 <head> 里的 preload,
       字体基本能在文字出现之前就绪,那一跳也就看不到了。 */
    font-family: "ACG Title";
    letter-spacing: normal; font-size: 30px;
  }
  /* 展开时也要更宽 —— 不然 72px 图标 + 站名两样挤不下。
     选择器写成 body.acg .rail:hover(三个类 + 伪类),权重压得过原来的 .rail:hover。 */
  body.acg .rail:hover, body.acg.rail-open .rail { width: 268px; }

  /* ---------- 内容区 ---------- */
  .page { margin-left: var(--rail-w); min-width: 0; }
  .pagehead {
    position: sticky; top: 0; z-index: 20;
    background: var(--headbg);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  /* 页头是一行:[返回按钮(按需出现)] [标题] */
  .headrow {
    max-width: 660px; margin: 0 auto; padding: 14px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .headrow h1 {
    margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 右上角的用户菜单:头像 → 点开是下拉列表 */
  .usermenu { margin-left: auto; flex: 0 0 auto; }
  .avatar-btn { padding: 2px; }
  .avatar-btn .avatar { width: 30px; height: 30px; }
  .sel.more.user .sel-menu { left: auto; right: 0; min-width: 150px; }

  /* 返回按钮:在标题左边,箭头朝左 */
  .pageback { margin-left: -8px; color: var(--text); flex: 0 0 auto; }
  .pageback .ico { width: 22px; height: 22px; }
  .pageback .ico svg { width: 22px; height: 22px; display: block; }
  main { max-width: 660px; margin: 0 auto; padding: 4px 16px 80px; }
  .status { color: var(--muted); font-size: 13px; padding: 14px 0; }
  /* 列表末尾那行(滚到底自动加载时显示"加载中"或"到底了") */
  .more-sentinel { text-align: center; padding: 22px 0; font-size: 12.5px; }

  /* token 失效的提示条。
     用琥珀色而不是红色:站点本身没坏 —— 数据都还在、页面都正常,
     只是"新 star 不再同步进来了",需要用户去重新登录一下。
     红色会让人以为出了故障,而他真正要做的只是点一下登录。 */
  .tokenwarn {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 12px 0 4px; padding: 11px 14px;
    border: 1px solid var(--warn);
    background: var(--warn-bg);
    border-radius: 12px;
    font-size: 13.5px; line-height: 1.55;
  }
  .tokenwarn .grow { flex: 1 1 220px; }
  .tokenwarn a {
    color: var(--warn); font-weight: 700;
    text-decoration: none; white-space: nowrap;
  }
  .tokenwarn a:hover { text-decoration: underline; }
  /* 空了就不占位。搜索页顶部本来会多出一条空行 ——
     工具栏是空的但带着 padding,状态行写着"加载中"还没被清掉。 */
  .toolbar:empty, .status:empty { display: none; }

  /* ---------- 控件 ---------- */
  /* 胶囊按钮。内边距和 .sel-btn 保持一致 ——
     两个并排时高度差一点点,看着就是不齐。 */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--text); padding: 9px 15px; font-size: 13px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn .ico { width: 15px; height: 15px; display: block; flex: 0 0 auto; }
  .btn .ico svg { width: 15px; height: 15px; display: block; }

  /* 图标按钮:只有图标,没有文字。状态靠颜色,不靠文字。 */
  .icon-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: none; border-radius: var(--radius);
    color: var(--muted); padding: 6px 10px; cursor: pointer;
    font-size: 13px; font-family: inherit;
    transition: color .12s, background .12s;
  }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .icon-btn .ico { width: 21px; height: 21px; flex: 0 0 auto; }
  .icon-btn .ico svg { width: 21px; height: 21px; display: block; }
  .icon-btn.on { color: var(--like); }
  .icon-btn:disabled { opacity: .5; cursor: default; }
  .btn:hover { background: var(--hover); border-color: var(--text); }
  /* 文字色一定要跟着 accent 走 —— 写死 #000 的话,白天模式是深底黑字,直接看不见 */
  .btn.primary {
    background: var(--accent); color: var(--on-accent);
    border-color: var(--accent); font-weight: 600;
  }
  .btn.primary:hover { opacity: .88; }

  input[type="search"] {
    background: var(--fill); border: 1px solid transparent; border-radius: var(--radius);
    color: var(--text); padding: 9px 16px; font-size: 14px;
  }
  input[type="search"]::placeholder { color: var(--muted); }
  input[type="search"]:focus { outline: none; border-color: var(--line); background: transparent; }

  /* ---------- 自绘下拉 ----------
     原生 <select> 展开后那一列是操作系统画的:圆角改不了,color-scheme 只能改颜色。
     想要圆角就只能自己画一个。 */
  .sel { position: relative; display: inline-block; }
  .sel-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--fill); border: 1px solid transparent; border-radius: var(--radius);
    color: var(--text); padding: 9px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .sel-btn:hover { border-color: var(--line); }
  .sel-caret { color: var(--muted); font-size: 9px; }
  .sel-menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
    min-width: 100%; padding: 5px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 14px;                  /* ← 就是要这个圆角 */
    box-shadow: 0 10px 30px var(--shadow);
  }
  .sel.open .sel-menu { display: block; }
  .sel-item {
    padding: 8px 12px; border-radius: 9px; font-size: 13.5px;
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .sel-item:hover { background: var(--hover); }
  .sel-item.on { font-weight: 700; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 0; }
  .muted { color: var(--muted); font-size: 12.5px; }

  /* 标签胶囊 */
  .chip, .topic {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 3px 11px; font-size: 12px; color: var(--muted); display: inline-block;
  }
  .chip { color: var(--text); cursor: pointer; }
  .chip:hover { border-color: var(--text); }
  .topic.clickable { cursor: pointer; }
  .topic.clickable:hover { color: var(--text); border-color: var(--text); }
  .topic.on, .chip.on {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  }

  /* ---------- 条目:头像左、内容右 ---------- */
  .post {
    position: relative;       /* "更多"按钮要绝对定位到右上角 */
    display: flex; gap: 12px; padding: 14px 12px; margin: 0 -12px;
    border-bottom: 1px solid var(--line); border-radius: 12px;
    transition: background .12s;
    cursor: pointer;          /* 整块可点进详情 */
  }
  .post:hover { background: var(--hover); }
  .post-avatar { flex: 0 0 auto; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--fill); object-fit: cover; display: block;
  }
  .post-body { flex: 1 1 auto; min-width: 0; }
  .post-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .name:hover { text-decoration: underline; }
  .post-head .muted { font-size: 12.5px; }
  .desc { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .intro { margin: 4px 0 0; font-size: 14.5px; }
  .desc, .intro {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .topics { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .actions { display: flex; align-items: center; gap: 2px; margin-top: 9px; flex-wrap: wrap; }
  .post.dim { opacity: .4; }
  .reason { font-size: 12px; color: var(--muted); margin-left: 6px; }

  /* "更多"菜单:复用下拉面板那套(圆角 + 点外面收起) */
  .sel.more .sel-menu { left: auto; right: 0; min-width: 170px; }
  /* 列表卡片里钉在右上角 */
  .sel.more.topright { position: absolute; top: 4px; right: 6px; }
  .sel.more .sel-item { display: flex; align-items: center; gap: 9px; }
  .sel.more .sel-item .ico { width: 16px; height: 16px; flex: 0 0 auto; color: var(--muted); }
  .sel.more .sel-item .ico svg { width: 16px; height: 16px; display: block; }
  /* 菜单里用图片当图标的(兔子洞)。尺寸和 .ico 对齐,不然那一行会比别的矮/高。 */
  .sel.more .sel-item .menu-img { width: 16px; height: 16px; flex: 0 0 auto; }

  /* ---------- 未登录:整页只有登录界面 ---------- */
  /* 没登录时不显示导航,内容也不用给它让位。
     ⚠️ 下面这条 .rail 是必须的:app.js 只是把 railEl.replaceChildren() 清空,
     元素本身还在 —— 它带着 flex / 背景色 / 右边框,于是登录页左侧会留下
     一条 56px 的空栏。(手机端本来就 .rail { display: none },所以只有桌面端看得见。) */
  body.logged-out .rail { display: none; }
  body.logged-out .page { margin-left: 0; }
  .login-screen {
    max-width: 380px; margin: 14vh auto 0; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .login-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
  }
  .login-brand .ico { width: 34px; height: 34px; }
  .login-brand .ico svg { width: 34px; height: 34px; display: block; }
  .login-blurb { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.6; }

  /* ---------- 区块 ---------- */
  .section { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 14px; }
  .section-title {
    font-size: 12px; color: var(--muted); letter-spacing: .04em;
    margin-bottom: 10px; text-transform: uppercase;
  }

  /* ---------- 搜索页 ---------- */
  .searchbar { display: flex; gap: 8px; padding: 14px 0 4px; }
  .searchbar input[type="search"] { flex: 1 1 auto; min-width: 0; }
  .author-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .author {
    display: flex; align-items: center; gap: 8px; text-decoration: none;
    font-size: 13.5px; color: var(--text);
  }
  .author .avatar { width: 28px; height: 28px; }
  .author:hover { text-decoration: underline; }

  /* 已关注:竖排列表 */
  .follow-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; margin: 0 -12px; border-radius: 12px;
    border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--text);
  }
  .follow-row:hover { background: var(--hover); }
  .follow-row .avatar { width: 44px; height: 44px; }
  .follow-info { flex: 1 1 auto; min-width: 0; }
  .follow-login { font-weight: 600; font-size: 15px; }
  .follow-name { color: var(--muted); font-size: 13px; }
  .follow-date { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ---- 已收藏 → 现状 ---- */
  .status-note {
    font-size: 12.5px; line-height: 1.6; padding: 8px 0 12px;
    white-space: normal;
  }
  .status-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin: 0 -12px; border-radius: 12px;
    border-bottom: 1px solid var(--line);
    text-decoration: none; color: var(--text);
  }
  .status-row:hover { background: var(--hover); }
  /* 一个颜色点说清"还活着吗" —— 不写文字,扫一眼就能看出整体 */
  .health-dot {
    flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted);
  }
  .health-dot.active  { background: #2ecc71; }
  .health-dot.slowing { background: #f0b429; }
  .health-dot.stale   { background: #e86452; }
  .status-main { flex: 1 1 auto; min-width: 0; }
  .status-main .name {
    font-size: 14.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-sub { color: var(--muted); font-size: 12.5px; }
  .status-right { text-align: right; white-space: nowrap; }
  .status-delta { font-size: 13px; font-variant-numeric: tabular-nums; }
  .status-delta.up { color: #2ecc71; font-weight: 600; }
  .status-when { font-size: 11.5px; }

  /* 工具栏里的搜索框。已关注页和标签页共用 —— 原来叫 .follow-search,
     加了标签页之后那个名字就对不上了。 */
  .toolbar-search { flex: 1 1 170px; min-width: 120px; }

  /* 介绍右下角的翻译按钮 */
  .intro-wrap { position: relative; }
  .intro-wrap .intro { padding-right: 34px; }   /* 给按钮让位,别压住字 */
  .intro-wrap .translate-btn { position: absolute; right: 0; bottom: -4px; padding: 2px 5px; }
  .intro-wrap .translate-btn .ico { width: 16px; height: 16px; }
  .intro-wrap .translate-btn .ico svg { width: 16px; height: 16px; display: block; }

  /* ---------- 详情 ---------- */
  .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 0 4px; }
  .detail-head .avatar { width: 56px; height: 56px; }
  /* 头像本身是链接:点了去作者主页 */
  .avatar-link { display: inline-block; line-height: 0; border-radius: 50%; }
  .avatar-link:hover .avatar { outline: 2px solid var(--muted); outline-offset: 2px; }
  /* 详情页标题本身就是链接 */
  a.detail-title { color: var(--text); text-decoration: none; }
  a.detail-title:hover { text-decoration: underline; }

  /* 区块标题行:左标题、右操作(比如 README 的翻译按钮) */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .section-head .section-title { margin-bottom: 0; }
  .detail-title { font-size: 18px; margin: 0; font-weight: 700; }
  .detail-desc { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .detail-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; align-items: center; }
  .owner { display: inline-flex; align-items: center; gap: 5px; }
  .owner .avatar { width: 16px; height: 16px; }
  .owner-link { color: var(--muted); text-decoration: none; }
  .owner-link:hover { color: var(--text); text-decoration: underline; }
  .delta { color: var(--text); }
  pre.readme {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    font: 12.5px/1.7 ui-monospace, Consolas, "Noto Sans Mono CJK SC", monospace;
    max-height: 520px; overflow-y: auto;
  }
  .chart { display: flex; align-items: flex-end; gap: 20px; height: 110px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .chart-bar { width: 24px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .chart-label { font-size: 11px; color: var(--muted); }
  .similar-row { padding: 5px 0; font-size: 13.5px; }

  /* ---------- 窄屏(手机):不要导航栏,改成标题旁边一个下拉 ----------
     试过两种方案都不行:
       ① 左侧竖栏       → 390px 的屏幕被占掉 176px(45%)
       ② 底部 5 图标条  → 还是挤
     最后选:标题右边放一个"下箭头",点开是个菜单。
     **完全不占常驻空间**,而且手机上不需要 hover 那套东西。 */
  #navmenu { display: none; }          /* 大屏幕用左侧竖栏,不用这个 */

  /* ⚠️ 选择器必须写得够具体(四个类),不能用 .navmenu .sel-menu(两个类)。
     上面那条 .sel.more .sel-menu 是**三个类**,权重更高 ——
     类型相同比权重,权重相同才比先后。权重比不过的话这条就会被它盖掉,
     菜单会按"贴右边"定位,从这个按钮往左展开,在手机上直接跑出屏幕外。 */
  .navmenu .sel.more .sel-menu { left: 0; right: auto; min-width: 168px; }

  @media (max-width: 700px) {
    .rail { display: none; }           /* 手机上彻底不要竖栏 */
    #navmenu { display: block; }       /* 换成标题旁边的下拉 */
    .page { margin-left: 0; }
    .login-screen { margin-top: 6vh; }

    /* ---------- 兔子洞在手机上的两处适配 ---------- */

    /* ① 背景:**手机上不用那张图,纯色。**
       桌面那套是 `130% auto` + 左锚点,用途是把人物推到内容栏右边。
       但手机是**竖屏**,又窄又长,而 `auto` 是按**宽度**推高度的:
       375 宽的屏上 130% = 487px 宽,图高只有 487 × 9/16 ≈ 274px,
       视口却高 667px —— 图根本盖不满。
       让它 cover 也只是把一张 16:9 的横图硬拉进竖屏,人物会被裁得只剩一块;
       而且 `background-attachment: fixed` 在 iOS Safari 上本来就不生效。
       竖屏上这张图**没有一种摆法是好看的**,所以干脆不用 ——
       纯色(跟着主题走的 --bg)反而干净。 */
    body.acg,
    body.acg.light {
      background-image: none;
    }

    /* ② 标题字号。
       那句日文在 30px 下要 330px 宽,而 375 的屏扣掉左右内边距(32)
       和两个按钮(▾ 约 30、头像约 34)之后只剩下 263px —— 会被省略号截掉一截。
       降到 21px 大约 230px,放得下,和主站标题也一样大。 */
    body.acg .headrow h1 { font-size: 21px; }
  }

  /* ---------- 详情页的笔记 ---------- */
  .comment-input {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: var(--fill); border: 1px solid transparent; border-radius: 14px;
    color: var(--text); padding: 11px 14px; font: inherit; font-size: 14px;
  }
  .comment-input::placeholder { color: var(--muted); }
  .comment-input:focus { outline: none; border-color: var(--line); background: transparent; }
  .comment-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .comment-list { margin-top: 16px; }
  .comment { border-top: 1px solid var(--line); padding: 10px 0; }
  .comment-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted); margin-bottom: 4px;
  }
  .comment-meta .avatar { width: 18px; height: 18px; }
  .comment-body { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="page">
  <div class="pagehead">
    <div class="headrow">
      <button id="pageback" class="icon-btn pageback" style="display:none"></button>
      <!-- 标题留空:由 JS 在启动时**同步**填上。
           以前这里写死 "Trending",而 JS 要等异步的登录检查跑完才改,
           于是会先闪一下 "Trending" 再跳成真正的那页 —— 看起来像刷新了两次。 -->
      <h1 id="pagetitle"></h1>
      <div id="navmenu" class="navmenu"></div>
      <div id="usermenu" class="usermenu"></div>
    </div>
  </div>
  <main>
    <!-- token 失效的提示条(内容由 JS 按需填,空着就是 display:none)。
         放在 main 最前面而不是页头里,是为了让它**跨页面保留**:
         loadList / showDetail 只会清空 toolbar / list / detail,碰不到它,
         所以切页面时提示不会消失。 -->
    <div id="tokenwarn" class="tokenwarn" style="display:none"></div>
    <div id="toolbar" class="toolbar"></div>
    <div id="status" class="status">加载中…</div>
    <div id="detail" style="display:none"></div>
    <div id="searchpage" style="display:none"></div>
    <div id="list"></div>
  </main>
</div>

<aside class="rail" id="rail"></aside>

<!-- __ASSET_V__ 是个占位符,由 api.py 的 index_page() 在运行时替换成
     app.js 的**内容哈希**。

     为什么非得这样:浏览器对 .js 会缓存,而走 Cloudflare 时它的缓存头
     会被强制改写(实测源站说 no-cache、max-age=0 都没用,客户端一律拿到
     4 小时)。光靠缓存头治不了,得靠**换 URL** —— 内容一变哈希就变,
     URL 一变浏览器就必定重新下载;内容没变 URL 也不变,照常走缓存。

     所以:别把这个占位符改成写死的数字,也别手动改它 —— 它现在是自动的。 -->
<script src="app.js?v=__ASSET_V__"></script>
</body>
</html>
